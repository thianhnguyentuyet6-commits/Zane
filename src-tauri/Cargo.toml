[package]
name = "zane"
version = "0.9.14"
description = "Zane Windows PC智能管家 - 本地AGI，离线优先，深度Windows控制"
authors = ["Zane"]
license = "MIT"
repository = "https://github.com/zane/windows"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.2", features = [] }
tauri-plugin-shell = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-fs = "2.2"
tauri-plugin-notification = "2.2"
tauri-plugin-autostart = "2.0"
tauri-plugin-global-shortcut = "2.2"
tauri-plugin-single-instance = "2.2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
